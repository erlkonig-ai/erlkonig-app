[workspace]
resolver = "3"
members = ["crates/erlkonig-core", "crates/erlkonig-node", "crates/erlkonig"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
erlkonig-core = { path = "crates/erlkonig-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
libc = "0.2"
signal-hook = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
png = "0.18"
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 4
