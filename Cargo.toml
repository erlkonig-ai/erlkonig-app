[workspace]
resolver = "3"
members = ["crates/erlkonig-core", "crates/erlkonig"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
erlkonig-core = { path = "crates/erlkonig-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
libc = "0.2"
signal-hook = "0.4"
anyhow = "1"
getrandom = "0.4"
hex = "0.4"
hifitime = "4.3"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
faculties = { path = "../faculties", default-features = false }
triblespace = { path = "../triblespace-rs", default-features = false }
triblespace-net = { path = "../triblespace-rs/triblespace-net" }
trible = { path = "../triblespace-rs/trible", default-features = false }
ed25519-dalek = "2.2"
iroh-base = "1.0"
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
block2 = "0.6.2"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CADisplayLink", "objc2-core-foundation"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 4

[patch.crates-io]
# Exact deployed-031 source closure; dependency patch tables are not inherited.
anybytes = { path = "../anybytes" }
netwatch = { git = "https://github.com/erlkonig-ai/net-tools.git", rev = "10ab7b328809103be74f6ca24258249715fae52b" }
triblespace-core = { path = "../triblespace-rs/triblespace-core" }
