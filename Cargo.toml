[workspace]
resolver = "3"
members = ["crates/erlkonig-core", "crates/erlkonig-app", "crates/erlkonig-linux", "crates/erlkonig-mac"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
erlkonig-core = { path = "crates/erlkonig-core" }
erlkonig-app = { path = "crates/erlkonig-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
libc = "0.2"
signal-hook = "0.4"
anyhow = "1"
getrandom = "0.4"
hex = "0.4"
blake3 = "1"
hifitime = "4.3"
rayon = "1.12"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
faculties = { path = "../faculties", default-features = false }
# Private prototype only: this sibling is not part of the public app closure.
faculties-erp = { path = "../faculties-erp" }
triblespace = { path = "../triblespace-rs", default-features = false }
triblespace-net = { path = "../triblespace-rs/triblespace-net" }
trible = { path = "../triblespace-rs/trible", default-features = false }
ed25519-dalek = "2.2"
iroh-base = "1.0"
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
block2 = "0.6.2"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LABase", "LABiometryType", "LAError", "block2", "objc2-security"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "SecBase", "SecItem", "SecKey", "SecAccessControl", "SecTask"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFError"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CADisplayLink", "objc2-core-foundation"] }
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "wayland", "x11"] }
egui-wgpu = { version = "0.34", default-features = false, features = ["winit", "wayland", "x11"] }
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
pollster = "0.4"
zeroize = "1"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 4

[patch.crates-io]
# Sibling source closure; dependency patch tables are not inherited.
anybytes = { path = "../anybytes" }
netwatch = { git = "https://github.com/erlkonig-ai/net-tools.git", rev = "10ab7b328809103be74f6ca24258249715fae52b" }
triblespace-core = { path = "../triblespace-rs/triblespace-core" }
