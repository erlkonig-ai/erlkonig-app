[package]
name = "erlkonig-app-icon"
version = "0.0.0"
edition = "2024"
publish = false

# Keep icon generation independent of the app/backend source closure.
[workspace]

[dependencies]
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
block2 = "=0.6.2"

[profile.release]
strip = "symbols"
debug = 0
incremental = false
