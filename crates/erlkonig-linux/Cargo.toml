[package]
name = "erlkonig-linux"
description = "The Erlkonig tray app for Linux, installed as `erlkonig`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
erlkonig-app.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
erlkonig-core.workspace = true
signal-hook.workspace = true
tray-icon = { workspace = true, features = ["ksni"] }
winit = { workspace = true, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
zbus.workspace = true
pollster.workspace = true
