[package]
name = "faculties-erp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "ERP source imports, bookkeeping and financial observations for Erlkönig"

[dependencies]
anybytes.workspace = true
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4.5.4", features = ["derive", "env"] }
ed25519-dalek.workspace = true
faculties.workspace = true
hifitime = "4.2.3"
num-rational = "0.4"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
triblespace = { workspace = true, features = ["parallel"] }

[dev-dependencies]
tempfile = "3"
