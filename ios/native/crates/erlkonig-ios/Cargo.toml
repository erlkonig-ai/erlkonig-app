[package]
name = "erlkonig-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
erlkonig-crown = { path = "../erlkonig-crown" }
triblespace-core.workspace = true
triblespace-net.workspace = true
ed25519-dalek.workspace = true
anyhow.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
synthetic-proof = ["dep:iroh", "dep:iroh-base"]

[dependencies.iroh]
version = "1.0"
optional = true

[dependencies.iroh-base]
version = "1.0"
optional = true

[[bin]]
name = "ios-replica-proof"
path = "src/proof_main.rs"
required-features = ["synthetic-proof"]

[dev-dependencies]
tempfile = "3"
