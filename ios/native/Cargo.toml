[workspace]
members = ["crates/erlkonig-crown", "crates/erlkonig-ios"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.2"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
triblespace-core = { path = "../upstream/triblespace-rs/triblespace-core", default-features = false }
triblespace-net = { path = "../upstream/triblespace-rs/triblespace-net" }
anyhow = "1"
ed25519-dalek = "2.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "io-util"] }

[patch.crates-io]
anybytes = { path = "../upstream/anybytes" }
netdev = { path = "../upstream/netdev" }
netwatch = { path = "../upstream/net-tools/netwatch" }
triblespace-core = { path = "../upstream/triblespace-rs/triblespace-core" }
